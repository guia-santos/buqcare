<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="favicon.png" rel="icon" type="image/x-icon" />
    <link href="favicon.png" rel="shortcut icon" type="image/x-icon" />

    <title>Guia Santos - Buq Care</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #FAFAFA;
        }

        img {
            max-width: 100%;
        }

        .container {
            max-width: 1230px;
            padding: 0 10px;
            margin: 0px auto;
            width: 100%;
            position: relative;
        }

        header {
            background-color: #582A9D;
            color: #fff;
        }

        .header-items {
            padding: 1px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header-items .search-box {
            background: #fff;
            border-radius: 25px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            max-width: 300px;
            width: 100%;
            position: absolute;
            left: 0;
        }

        .header-items .search-box input {
            border: none;
            outline: none;
            width: 100%;
            color: #582A9D;
            font-size: 14px;
        }

        .header-items .search-box svg {
            fill: #582A9D;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .header-items .logo {
            width: 120px;
        }

        .whatsapp svg,
        .instagram svg {
            width: 21px;
            height: 21px;
            fill: #fff;
            margin-top: 4px;
        }

        .sub-header {
            background-color: #582A9D;
            color: #fff;
            text-align: center;
            padding: 5px 0;
            font-size: 21px;
            letter-spacing: 1px;
        }

        .sub-header-items {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 35px;
        }

        .div-perfil {
            display: flex;
            justify-content: end;
            align-items: center;
            height: 100%;
        }

        .div-perfil img {
            border-radius: 18px;
            border: 1px solid #582A9D;
        }

        .banner {
            background: url('banner.jpg') no-repeat left center;
            background-size: auto;
            background-size: cover;
            height: 470px;
            width: 100%;
            position: relative;
            display: flex;
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin: 30px 0 40px 0;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 0;
            text-align: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            border: 1px solid #E1E1E1;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, .3);
        }

        .tag {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            z-index: 2;
            background-color: #582A9D;
            padding: 5px 10px;
            border-radius: 6px;
        }

        .card img {
            width: 100%;
            height: 100%;
        }

        .card-title {
            font-size: 13px;
            color: #411386;
            font-weight: 500;
            text-transform: uppercase;
            min-height: 40px;
        }

        .price-box {
            margin-top: auto;
        }

        .price-original {
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
            margin-right: 8px;
        }

        .price-current {
            font-size: 20px;
            color: #582A9D;
            font-weight: 700;
        }

        #search-div {
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
            font-weight: 600;
            color: #582a9d;
            display: none;
        }

        .page-title {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            font-weight: 700;
            color: #582a9d;
        }

        @media (max-width: 900px) {
            .banner {
                background: url('banner_mobile.jpg') no-repeat left center;
            }
        }

        @media (max-width: 768px) {
            .header-items {
                flex-direction: column;
                gap: 1px;
                padding: 10px 0 20px 0px;
            }

            .header-items .search-box {
                width: 100%;
                order: 2;
                position: relative;
            }

            .header-items .logo {
                order: 1;
                position: relative;
            }

            #lista-produtos {
                grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
                gap: 15px;
            }

            .card .card-btn .btn {
                width: 100%;
            }
        }

        @media (max-width: 535px) {
            .div-perfil {
                justify-content: center;
            }
        }

        .card-top {
            position: relative;
            display: block;
            height: 100%;
            border-bottom: 3px solid #582A9D;
            background: #f6f6f6;
        }

        .card-bottom {
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card .card-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 11px;
        }

        .card .card-btn .btn {
            border: 1px solid #582A9D;
            border-radius: 35px;
            font-size: 13px;
            padding: 4px 6px;
            color: #582A9D;
            text-decoration: none;
            display: flex;
            align-content: center;
            gap: 3px;
            min-width: 90px;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
        }

        .card .card-btn .btn svg {
            width: 16px;
            height: 16px;
            fill: #582A9D;
        }

        .card .card-btn .btn:hover {
            opacity: 0.4;
        }

        .card .card-btn .btn.sty1 {
            background: #2acb08;
            border-color: #2acb08;
            color: #fff;
        }

        .card .card-btn .btn.sty1 svg {
            fill: #fff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 10px 10px;
        }

        .modal-box {
            background: #fff;
            border-radius: 18px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            position: relative;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .fechar-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 32px;
            color: #582A9D;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }

        .modal-content {
            display: flex;
            gap: 15px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .modal-img-container {
            width: 38%;
            flex-shrink: 0;
        }

        .modal-img-container img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .modal-info {
            width: 55%;
            display: flex;
            flex-direction: column;
        }

        .modal-info h2 {
            color: #411386;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .modal-desc-box {
            flex-grow: 1;
            font-size: 13px;
            color: #454545;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .modal-btn-wts {
            background: #2acb08;
            color: #fff;
            padding: 9px 6px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .modal-btn-wts:hover {
            opacity: 0.8;
        }

        .modal-btn-wts svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
            }

            .modal-img-container {
                width: 100%;
            }

            .modal-info {
                width: 100%;
            }

            .modal-box {
                padding: 15px 10px;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

                                d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.23c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05s.89 2.38 1.01 2.54c.12.17 1.73 2.66 4.2 3.66.59.24 1.05.38 1.41.49.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.1-.23-.16-.48-.28z">

    <script>
        const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgDqIzCG8Lvm-QWuMYBAFh8WHtJgNEPP8Qo-19OYfVlQMT__NjyKlXtvGMV_mQ0GKpD8quaTGjkw4z/pub?output=csv";
        const wts = 'https://wa.me/5585985771028';
        var produtosAtuais = [];

        function renderizarProdutos(produtos) {
            const container = document.getElementById('lista-produtos');

            if (produtos.length === 0) {
                container.innerHTML = "<p style=\"text-align:center; width: 100%;position: absolute;\">Nenhum resultado</p>";
                return;
            }

            container.innerHTML = produtos.map(p => {
                let tagHtml = '';
                if (typeof p.tag != "undefined" && p.tag && p.tag.trim() !== "") {
                    tagHtml = `<div class="tag tag-rect">${p.tag}</div>`;
                }

                let preco_atual = typeof p.preco_atual != "undefined" && p.preco_atual && p.preco_atual.trim() !== "" ? remover_moeda(p.preco_atual) : 0;
                let preco_original = typeof p.preco_original != "undefined" && p.preco_original && p.preco_original.trim() !== "" ? remover_moeda(p.preco_original) : 0;

                let precoHtml = '';
                if (preco_original && preco_original !== preco_atual) {
                    precoHtml = `<span class="price-original">${moeda(preco_original)}</span>`;
                }

                let linkWts = `${wts}?text=Olá! Tenho interesse no produto ${p.nome}`;

                let htmlPrecoAtual = preco_atual ? `<div class="price-box">${precoHtml} <span class="price-current">${moeda(preco_atual)}</span> </div>` : ``;

                let htmlQuantidade = typeof p.quantidade != "undefined" && p.quantidade && p.quantidade.trim() !== "" ? `<div class="price-box"><span class="price-current">${p.quantidade} Disponíveis</span></div>` : ``;

                return `
                <div class="card">
                    <a class="card-top" href="${linkWts}" target="_blank">
                        ${typeof p.imagem != "undefined" && p.imagem ? `<img src="${p.imagem}" title="${p.nome}" alt="${p.nome}">` : ``}
                        ${tagHtml}
                    </a>

                    <div class="card-bottom">
                        <div class="card-title">${p.nome}</div>
                        ${htmlPrecoAtual}
                        ${htmlQuantidade}
                        <div class="card-btn">
                            <a href="${linkWts}" target="_blank" class="btn sty1">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.23c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05s.89 2.38 1.01 2.54c.12.17 1.73 2.66 4.2 3.66.59.24 1.05.38 1.41.49.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.1-.23-.16-.48-.28z"></path>
                                </svg> 
                                Falar Whatsapp
                            </a>
                            <span class="btn" onclick="abrirModal('${p.id}');">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path>
                                </svg>
                                Espiar
                            </span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        function moeda(valor, exibir_sifrao = true, sifrao = 'R$') {
            valor = parseFloat(valor).toFixed(2).split('.');
            let inteiro = valor[0];
            let decimal = valor[1];
            inteiro = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return (exibir_sifrao ? sifrao + '' : '') + inteiro + ',' + decimal;
        }
        function remover_moeda(valor) {
            valor = valor.replace(/[^\d,-]/g, '').replace('.', '').replace(',', '.');
            return parseFloat(valor) || 0;
        }

        function carregarDadosDaPlanilha() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = "<p style=\"text-align:center; width: 100%;position: absolute;\">Carregando Catálogo ...</p>";

            Papa.parse(urlPlanilha, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function (results) {
                    produtosAtuais = [];
                    let contadorId = 0;
                    results.data.forEach(produto => {
                        if (produto.exibir && produto.exibir.trim().toLowerCase() === 'sim') {
                            produto.id = contadorId;
                            produtosAtuais.push(produto);
                            contadorId++;
                        }
                    });

                    renderizarProdutos(produtosAtuais);
                },
                error: function (err) {
                    console.error("Erro ao ler a planilha:", err);
                    container.innerHTML = "<p style=\"text-align:center; width: 100%;position: absolute;\">Catálogo não carregado. Tente novamente mais tarde!</p>";
                }
            });
        }

        carregarDadosDaPlanilha();
    </script>

    <script>
        function normalizarString(str) {
            if (!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "").toLowerCase();
        }

        document.querySelector('.search-box input').addEventListener('input', function (e) {
            let txtSearch = e.target.value;
            const termoBusca = normalizarString(txtSearch);
            const produtosFiltrados = produtosAtuais.filter(p => normalizarString(p.nome).includes(termoBusca));
            renderizarProdutos(produtosFiltrados);

            const pageTitle = document.querySelector('.page-title');
            if (txtSearch.trim() !== "") {
                pageTitle.textContent = `Resultados da Busca: "${txtSearch}"`;
            } else {
                pageTitle.textContent = "Catálogo de Produtos";
            }
        });

        const btnSearch = document.getElementById('btn-search');
        if (btnSearch) {
            btnSearch.addEventListener('click', function (event) {
                event.preventDefault();
                const destino = document.getElementById('lista-produtos');
                if (destino) {
                    destino.scrollIntoView({behavior: 'smooth'});
                }
            });
        }

    </script>

    <script>
        function abrirModal(id) {
            const produto = produtosAtuais.find(p => p.id == id);
            if (!produto) return;

            document.getElementById('modal-img').src = produto.imagem;
            document.getElementById('modal-nome').innerText = produto.nome;

            const linkWts = `${wts}?text=Olá! Tenho interesse no produto ${produto.nome}`;
            document.getElementById('modal-wts').href = linkWts;

            const descBox = document.getElementById('modal-desc');
            descBox.innerHTML = '<i>Carregando Aguarde...</i>';

            document.getElementById('modal-produto').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            if (produto.link && produto.link.trim() !== "") {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(produto.link)}`;

                fetch(proxyUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("Falha na rede");
                        return response.text();
                    })
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const descricaoEl = doc.querySelector('#product-description .product-description');
                        if (descricaoEl) {
                            descBox.innerHTML = descricaoEl.innerHTML;
                        } else {
                            descBox.innerHTML = '';
                            console.log('Detalhes não encontrados nesta página oficial');
                        }
                    })
                    .catch(() => {
                        const backupProxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(produto.link)}`;
                        fetch(backupProxyUrl)
                            .then(res => res.text())
                            .then(htmlBackup => {
                                const parserB = new DOMParser();
                                const docB = parserB.parseFromString(htmlBackup, 'text/html');
                                const descricaoElB = docB.querySelector('#product-description');

                                if (descricaoElB) {
                                    descBox.innerHTML = descricaoElB.innerHTML;
                                } else {
                                    descBox.innerHTML = '';
                                    console.log('Detalhes não encontrados nesta página.');
                                }
                            })
                            .catch(() => {
                                descBox.innerHTML = '';
                                console.log('Não foi possível carregar a descrição no momento.');
                            });
                    });
            } else {
                descBox.innerHTML = '';
                console.log('Descrição não disponível para este produto.');
            }
        }

        function fecharModal() {
            document.getElementById('modal-produto').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modal-produto').addEventListener('click', function (e) {
            if (e.target === this) {
                fecharModal();
            }
        });
    </script>
</body>

</html>
